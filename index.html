<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendataan & Cetak Perkembangan Fisik Siswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. CSS UNTUK TAMPILAN LAYAR (APLIKASI WEB FORM)
       ========================================================================== */
    body { background-color: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; }
    .main-container { padding-top: 50px; padding-bottom: 60px; }
    .card-custom { max-width: 700px; margin: 0 auto; background: #ffffff; border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 35px !important; }
    .header-logo { max-height: 70px; display: block; margin: 0 auto 15px; }
    .btn-custom { background-color: #2563eb; color: white; font-weight: 600; border-radius: 10px; padding: 12px; border: none; }
    .btn-custom:hover { background-color: #1d4ed8; }
    .btn-success-custom { background-color: #10b981; color: white; font-weight: 600; border-radius: 10px; padding: 12px; border: none; }
    .btn-success-custom:hover { background-color: #059669; }
    .section-title { font-weight: 700; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; font-size: 1rem; }
    .page { display: none; }
    .active-page { display: block; }

    /* ==========================================================================
       2. CSS KHUSUS UNTUK HALAMAN CETAK (PRINT LAYOUT)
       ========================================================================== */
    #print-area {
        display: none;
    }

    @media print {
        /* Sembunyikan elemen aplikasi web di layar saat print */
        body *, .main-container, .card-custom, form, button, .alert {
            display: none !important;
        }
        
        /* Tampilkan kontainer cetak secara penuh */
        #print-area {
            display: block !important;
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            line-height: 1.4;
            color: #000;
            background: #fff;
            padding: 0;
            margin: 0;
        }

        .print-page {
            box-sizing: border-box;
            padding: 10mm;
        }

        .kop-surat {
            text-align: center;
            border-bottom: 3px double #000;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .kop-surat h1 { font-size: 13pt; margin: 0; font-weight: bold; text-align: center; }
        .kop-surat h2 { font-size: 15pt; margin: 0; font-weight: bold; text-align: center; }
        .kop-surat p { font-size: 8.5pt; margin: 3px 0 0 0; font-style: italic; text-align: center; }

        .judul-dokumen {
            text-align: center;
            margin-bottom: 20px;
        }
        .judul-dokumen h3 { font-size: 12pt; margin: 0 0 3px 0; font-weight: bold; text-decoration: underline; }
        .judul-dokumen h4 { font-size: 11pt; margin: 0; font-weight: bold; }

        table.table-identitas {
            width: 100%;
            margin-bottom: 15px;
            border-collapse: collapse;
        }
        table.table-identitas td {
            padding: 4px 0;
            vertical-align: top;
            border: none !important;
        }
        table.table-identitas td.label { width: 18%; font-weight: bold; text-align: left; }
        table.table-identitas td.colon { width: 3%; text-align: center; }
        table.table-identitas td.value { width: 79%; text-align: left; }

        table.table-data-fisik {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table.table-data-fisik th, table.table-data-fisik td {
            border: 1px solid #000 !important;
            padding: 8px 4px;
            text-align: center;
            font-size: 10pt;
        }
        table.table-data-fisik th {
            font-weight: bold;
            background-color: #f2f2f2 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        table.table-catatan {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 35px;
        }
        table.table-catatan td {
            border: 1px solid #000 !important;
            padding: 12px;
            text-align: left;
            font-style: italic;
            min-height: 60px;
        }

        table.table-ttd {
            width: 100%;
            border-collapse: collapse;
        }
        table.table-ttd td {
            width: 50%;
            text-align: center;
            border: none !important;
            vertical-align: top;
        }
        .space-ttd {
            height: 75px;
        }
    }
  </style>
</head>
<body>

  <div class="container main-container">
    
    <div id="pageLogin" class="page active-page mt-5">
      <div class="card card-custom" style="max-width: 480px;">
        <img src="https://ruangbelajar.smkn1batam.sch.id/pluginfile.php/1/core_admin/logocompact/300x300/1772024815/logo-smkn1batam.png" class="header-logo" alt="Logo Sekolah">
        <h4 class="text-center fw-bold mb-1" style="color: #1e3a8a;">Form Pendataan Fisik</h4>
        <p class="text-muted text-center small mb-4">Silakan masukkan NISN Anda untuk mengisi data</p>
        
        <div class="mb-4">
          <label for="nisnInput" class="form-label fw-semibold">NISN</label>
          <input type="text" id="nisnInput" class="form-control form-control-lg" placeholder="Contoh: 0085538355" autocomplete="off">
        </div>
        
        <button onclick="prosesLogin()" id="btnLogin" class="btn btn-custom w-100">Masuk ke Formulir</button>
        
        <div id="loadingLogin" class="text-center mt-3" style="display:none;">
          <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
          <span class="text-muted small ms-2">Memeriksa database...</span>
        </div>
      </div>
    </div>

    <div id="pageForm" class="page">
      <div class="card card-custom">
        <div class="text-center mb-4">
          <img src="https://ruangbelajar.smkn1batam.sch.id/pluginfile.php/1/core_admin/logocompact/300x300/1772024815/logo-smkn1batam.png" style="max-height: 50px; margin-bottom: 10px;" alt="Logo Sekolah">
          <h4 class="fw-bold mb-0" style="color: #1e3a8a;">INPUT PERKEMBANGAN FISIK SISWA</h4>
          <p class="text-muted small">SMK NEGERI 1 BATAM | TA 2025/2026</p>
        </div>

        <div class="alert alert-secondary p-3 mb-4" style="border-radius: 12px; background-color: #f8fafc; border: 1px solid #e2e8f0;">
          <div class="row g-2 small text-dark fw-medium">
            <div class="col-3 text-muted">Nama Lengkap</div><div class="col-9">: <span id="txtNama" class="fw-bold text-primary"></span></div>
            <div class="col-3 text-muted">NISN</div><div class="col-9">: <span id="txtNisn"></span></div>
            <div class="col-3 text-muted">Kelas</div><div class="col-9">: <span id="txtKelas"></span></div>
          </div>
        </div>

        <form id="formFisik" onsubmit="prosesSimpan(event)">
          <input type="hidden" id="siswaBaris">
          <input type="hidden" id="catatanWalasSembunyi">

          <div class="section-title">1. INDIKATOR BERKACAMATA (YA / TIDAK)</div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Awal Semester</label>
              <select id="kacamataAwal" class="form-select" onchange="simpanDraft()" required>
                <option value="TIDAK">TIDAK</option>
                <option value="YA">YA</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Akhir Semester</label>
              <select id="kacamataAkhir" class="form-select" onchange="simpanDraft()" required>
                <option value="TIDAK">TIDAK</option>
                <option value="YA">YA</option>
              </select>
            </div>
          </div>

          <div class="section-title">2. LINGKAR KEPALA (CM)</div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Awal Semester (CM)</label>
              <input type="number" step="any" id="kepalaAwal" class="form-control" placeholder="Contoh: 52" oninput="simpanDraft()" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Akhir Semester (CM)</label>
              <input type="number" step="any" id="kepalaAkhir" class="form-control" placeholder="Contoh: 53" oninput="simpanDraft()" required>
            </div>
          </div>

          <div class="section-title">3. TINGGI BADAN (CM)</div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Awal Semester (CM)</label>
              <input type="number" step="any" id="tinggiAwal" class="form-control" placeholder="Contoh: 165" oninput="simpanDraft()" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Akhir Semester (CM)</label>
              <input type="number" step="any" id="tinggiAkhir" class="form-control" placeholder="Contoh: 167" oninput="simpanDraft()" required>
            </div>
          </div>

          <div class="section-title">4. BERAT BADAN (KG)</div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold text-muted small">Awal Semester (KG)</label>
              <input type="number" step="any" id="beratAwal" class="form-control" placeholder="Contoh: 60"
